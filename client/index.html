<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Critical resource hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.empire-reports.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- DNS prefetch for performance -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://api.empire-reports.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Primary Meta Tags -->
    <title>Empire Report - Where Adventure Meets Awareness</title>
    <meta
      name="title"
      content="Empire Report - Where Adventure Meets Awareness"
    />
    <meta
      name="description"
      content="Discover the world with Empire Report. Travel guides, breaking news, cultural stories, and visual journeys. Your gateway to adventure and global awareness."
    />
    <meta
      name="keywords"
      content="travel guides, global news, travel blog, breaking news, cultural stories, adventure, travel tips, world news, empire report"
    />
    <meta
      name="robots"
      content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    />
    <meta name="language" content="English" />
    <meta name="author" content="Empire Report" />

    <!-- Canonical URL - This will be overridden by react-helmet-async -->
    <link rel="canonical" href="https://empire-reports.com" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://empire-reports.com/" />
    <meta
      property="og:title"
      content="Empire Report - Where Adventure Meets Awareness"
    />
    <meta
      property="og:description"
      content="Discover the world with Empire Report. Travel guides, breaking news, cultural stories, and visual journeys."
    />
    <meta
      property="og:image"
      content="https://empire-reports.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Empire Report" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://empire-reports.com/" />
    <meta
      property="twitter:title"
      content="Empire Report - Where Adventure Meets Awareness"
    />
    <meta
      property="twitter:description"
      content="Discover the world with Empire Report. Travel guides, breaking news, cultural stories, and visual journeys."
    />
    <meta
      property="twitter:image"
      content="https://empire-reports.com/og-image.jpg"
    />

    <!-- Theme Color -->
    <meta name="theme-color" content="#2c586a" />
    <meta name="msapplication-TileColor" content="#2c586a" />

    <!-- Optimize font loading - preload critical font -->
    <link
      rel="preload"
      href="https://fonts.gstatic.com/s/montserrat/v26/JTUSjIg1_i6t8kCHKm459Wlhyw.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Load fonts with font-display swap for better performance -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Empire Report",
        "alternateName": "Empire Reports",
        "url": "https://empire-reports.com",
        "description": "Travel guides, breaking news, cultural stories, and visual journeys from around the world.",
        "inLanguage": "en-US",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://empire-reports.com/blogs?searchQuery={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Empire Report",
          "url": "https://empire-reports.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://empire-reports.com/logo.png",
            "width": 512,
            "height": 512
          }
        }
      }
    </script>

    <!-- Organization structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Empire Report",
        "url": "https://empire-reports.com",
        "logo": "https://empire-reports.com/logo.png",
        "description": "Travel guides, breaking news, cultural stories, and visual journeys from around the world.",
        "sameAs": [
          "https://twitter.com/EmpireReport",
          "https://facebook.com/EmpireReport"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
